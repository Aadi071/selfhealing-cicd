# Let's Encrypt issuers for automatic TLS on the k3s box. Staging first (its rate
# limits are generous and its certs are untrusted-but-safe for testing), then
# switch the Ingress to the prod issuer once you've confirmed issuance works.
# Solver uses HTTP-01 through k3s's built-in Traefik ingress.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL          # <- your email (LE expiry notices)
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL          # <- your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik
