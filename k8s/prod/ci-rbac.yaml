# Least-privilege identity for CI to deploy into the canary namespace.
# The GitHub Actions deploy job authenticates as this ServiceAccount — it can
# roll out the app but cannot touch anything else in the cluster. A good security
# talking point: even if the CI token leaked, blast radius is one namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: canary
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"] # for rollout status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: canary
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: canary
---
# k8s 1.24+ no longer auto-creates SA token secrets, so we request a long-lived
# one explicitly — this is what becomes the CI kubeconfig's credential.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: canary
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
